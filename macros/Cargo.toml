[package]
name = "layouts_rs_macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
heck = "0.5.0"
proc-macro2 = "1.0"
quip = "0.2.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

[dev-dependencies]
assert2 = "0.4.0"
prettyplease = "0.2"
pretty_assertions = "1"
