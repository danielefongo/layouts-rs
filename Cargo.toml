[package]
name = "layouts_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5", features = ["derive"] }
rand = "0.10.0"
rayon = "1.11.0"
rstest = "0.26.1"
indexmap = { version = "2.14.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
arrayvec = "0.7"
log = "0.4"
env_logger = "0.11"
mapping = { git = "https://github.com/danielefongo/mapping_rs" }
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
assert2 = "0.4.0"
mockall = "0.14.0"

[build-dependencies]
anyhow = "1.0.102"
askama = "0.15.6"
dsl = { path = "dsl" }
